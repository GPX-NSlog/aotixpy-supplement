# pY 特调翻译·补充包 —— 由 aotixpy 补充汉化项目生成
# 说明：本文件只补全 aotixpy 与原模组均未覆盖的词条，不修改任何原模组内容。
[mod-name]
pysimple=pY 精简

[mod-description]
pysimple=提供一系列设置，让 pY 的体验更加完善：整理菜单、更新图像、调整名称与描述、调整科技树、重新平衡配方速度等等。所有改动均可通过设置项完全自定义。

[mod-setting-name]
pysimple-recipe-menu=菜单整理
pysimple-graphics=视听调整
pysimple-descriptions=描述调整
pysimple-tech-tree=科技调整
pysimple-storage-tanks=储罐容量重平衡
pysimple-storage-chests=储箱容量重平衡
pysimple-energy=插件能耗重平衡
pysimple-decay=衰变时间重平衡
pysimple-brains=大脑重平衡
pysimple-faster-recipes=配方速度重平衡
pysimple-misc=其他平衡改动

[mod-setting-description]
pysimple-recipe-menu=依据物品在游戏内的相似性（而非所属 pY 模组）将所有物品重新归入 7 个分类。除原版的[font=default-semibold]物流[/font]、[font=default-semibold]生产[/font]、[font=default-semibold]中间产品[/font]与[font=default-semibold]战斗[/font]外，另设[font=default-bold][color=255,230,192]材料[/color][/font]、[font=default-bold][color=255,230,192]流体[/color][/font]与[font=default-bold][color=255,230,192]生物[/color][/font]三个分类。
pysimple-graphics=对部分图标、电路连接、地图颜色与音效进行微调。
pysimple-descriptions=对部分名称与描述进行微调。
pysimple-tech-tree=对科技树中部分科技与配方的位置进行微调。
pysimple-storage-tanks=依据尺寸统一流体储罐容量。\n与「pY工业设施」中的同名设置效果相同，但商队流体前哨站以及容量 1000、1500、4000、5000 的储罐除外——它们的容量现与其他同尺寸储罐一致。
pysimple-storage-chests=依据总储存占地面积统一容器容量。仅改动棚屋与仓库。
pysimple-energy=使更高阶插件增加耗电量。
pysimple-decay=使部分物品腐坏更快。影响纤维素、琼脂与培养皿。
pysimple-brains=降低缸中脑插芯所需的大脑数量，同时提高其他配料的需求量。\n降低生物支架所需的甲壳素，同时提高其他配料的需求量，使「打印大脑」更具可行性。
pysimple-faster-recipes=提高部分配方的速度，使产能爬坡更加平缓。低阶配方受益最多，逐级递减，最高阶不变。\n由于所需建筑更少，部分建筑会相应提高耗能以作补偿。\n具体改动见配方/实体描述。
pysimple-misc=若干较小的改动：\n调整「砾石」与「石头」盐水配方，使较难的配方不再更差。\n调整首个蓄电池的充放电速度。\n调整早期甲壳素加工配方，提高产量。\n调整工人的食物配方，提高产量并增大工人食物的堆叠上限。\n提高奥格兽的燃料值。\n调整氧化铁黏液配方，使其优于较简单的方案。\n调整煤层气配方，减少氧气与热空气消耗。\n调整法格诺特兽屠宰配方，产出更多气囊。\n调整锯片、内置燃烧器、完全黑暗、温控、计量泵、不稳定磷鎓与材料光谱分析的 T.U.R.D. 数值。\n新增地下管道升级配方。\n若已安装高架铁路，则延长其支撑长度。

[string-mod-setting]
pysimple-descriptions-1=否
pysimple-descriptions-2=是（多数调整）
pysimple-descriptions-3=是（全部调整）
pysimple-tech-tree-1=否
pysimple-tech-tree-2=是
pysimple-tech-tree-3=是（禁用敌人）

[string-mod-setting-description]
pysimple-descriptions-2=部分名称与描述不甚理想，此选项会改写它们以提升可读性。
pysimple-descriptions-3=除上述改动外，多产物配方的名称还会列出所有产物。
pysimple-tech-tree-2=部分科技与配方解锁过早，使科技树充斥无关信息。此选项会把它们移到首次真正有用的更深层位置。
pysimple-tech-tree-3=除上述改动外，早期无用的军事科技也会被下移到更深层。

[map-gen-preset-name]
py-streamlined=pY 精简

[map-gen-preset-description]
py-streamlined=除少数微调外，这些设置与[font=default-semibold][color=255,230,192]pY 推荐[/color][/font]一致。提高了铁/铜/石的丰度与石头/盐的频率。

